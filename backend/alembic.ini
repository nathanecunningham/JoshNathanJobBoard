# Alembic configuration. Run migrations from backend/ with:
#
#     uv run alembic upgrade head
#
# The database path comes from app settings (.env / DATABASE_PATH) inside
# alembic/env.py — there is no sqlalchemy.url here on purpose, so the app
# and the migrations can never point at different files.

[alembic]
# %(here)s = the directory containing this file, so commands work regardless
# of the current working directory.
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
