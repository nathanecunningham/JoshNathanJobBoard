[project]
name = "jobboard-backend"
version = "0.1.0"
description = "FastAPI backend for Josh and Nathan's job search dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "anthropic>=0.34",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the `app` package importable when running `uv run pytest` from backend/.
pythonpath = ["."]
